# Test contract for this module. Automated tests use tiny in-repo fixtures. In-app
# Run and ./run.sh import take the Admin's files: uploaded (W4H_DATA_DIR) or a folder
# (--data-dir). There is no bundled sample run.

slug: w4h-fitbit-csv-file-importer
kind: ingest
publisher: usc-infolab

tests:
  automated:
    command: pytest tests/ -q -m "not integration and not kaggle"
    sample:
      kind: fixtures
      path: tests/fixtures

# Form contract. dataset_id is injected by in-app Run as W4H_DATASET_ID.
# Files: in-app Run passes the Admin's upload as W4H_DATA_DIR; the CLI takes --data-dir (subfolders
# included) and the notebook has a file chooser. Other fields are defaults testers can override.
inputs:
  - key: dataset_id
    type: dataset
    create: empty
  - key: dataset_title
    type: text
    default: Fitbit file-importer test
    override: true
  - key: files
    type: files
    required: false
